name: Release Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  test:
    name: Vet and Test
    runs-on: ubuntu-latest

    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    - name: Test Race Conditions
      run: go test -race -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        os: [linux]
        arch: [amd64]

    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      OUTPUT_FILE: bootstrap
      OUTPUT_ZIP: function-${{ github.event.repository.name }}_${{ github.ref_name }}.zip

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build -o "${{ env.OUTPUT_FILE }}" -v .

    - name: Package
      run: zip "./${{ env.OUTPUT_ZIP }}" "${{ env.OUTPUT_FILE }}"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.OUTPUT_ZIP }}
        path: ${{ env.OUTPUT_ZIP }}

    - name: Create GitHub Release and attach asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sha256sum ${{ env.OUTPUT_ZIP }} > ${{ env.OUTPUT_ZIP }}_SHA256SUMS
        gh release create "${{ github.ref_name }}" \
          --title "Release ${{ github.ref_name }}" \
          --prerelease \
          "${{ env.OUTPUT_ZIP }}" \
          "${{ env.OUTPUT_ZIP }}_SHA256SUMS"

    - name: Upload S3 Release Asset
      env:
        AWS_S3_BUCKET: releases.lab.dioad.net
        AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_UPLOAD_S3_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_UPLOAD_S3_SECRET_ACCESS_KEY }}
        AWS_REGION: 'eu-west-2'
      run: |
        aws s3 cp ${{ env.OUTPUT_ZIP }} s3://${{ env.AWS_S3_BUCKET }}/data/${{ github.event.repository.name }}/${{ github.ref_name }}/${{ env.OUTPUT_ZIP }} \
           --no-guess-mime-type \
           --content-type "application/zip" \
           --no-progress \
           --sse AES256
        aws s3 cp ${{ env.OUTPUT_ZIP }}_SHA256SUMS s3://${{ env.AWS_S3_BUCKET }}/data/${{ github.event.repository.name }}/${{ github.ref_name }}/${{ env.OUTPUT_ZIP }}_SHA256SUMS \
           --no-guess-mime-type \
           --content-type "text/plain" \
           --no-progress \
           --sse AES256

